name: lisku
description: "Aplikasi produktivitas harian untuk mengelola tugas, keuangan, dan aktivitas"
publish_to: 'none' # Aplikasi tidak akan dipublish ke pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # CORE DEPENDENCIES
  # ============================================

  # Internationalization & Date Formatting
  intl: ^0.19.0

  # Local Database (NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.0.5

  # ============================================
  # NOTIFICATIONS
  # ============================================

  # Local notifications dengan support timezone
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ============================================
  # PERMISSIONS & SYSTEM
  # ============================================

  # Handle runtime permissions (notifications, storage, etc.)
  permission_handler: ^11.3.1

  # ============================================
  # FILE HANDLING & SHARING
  # ============================================

  # Akses path direktori system (documents, cache, etc.)
  path_provider: ^2.1.5

  # Share files ke aplikasi lain
  share_plus: ^10.1.0

  # Pick files dari device (untuk backup/restore)
  file_picker: ^8.1.3

  # ============================================
  # UI COMPONENTS
  # ============================================

  # Icon set standar iOS
  cupertino_icons: ^1.0.8

  # ============================================
  # ASISTEN AI (LLM lokal via Termux)
  # ============================================

  # HTTP client untuk streaming SSE ke llama-server lokal
  http: ^1.6.0

  # Ekstrak teks PDF per halaman (pure Dart) untuk RAG e-book
  syncfusion_flutter_pdf: ^31.1.19

# ============================================
# DEVELOPMENT DEPENDENCIES
# ============================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generate Hive adapters untuk model classes
  hive_generator: ^2.0.1

  # Build runner untuk code generation
  build_runner: ^2.4.13

  # Linting rules untuk code quality
  flutter_lints: ^5.0.0

# ============================================
# FLUTTER CONFIGURATION
# ============================================
flutter:
  uses-material-design: true

  # Skrip Termux untuk asisten AI (dikirim inline lewat RUN_COMMAND)
  assets:
    - termux/

  # Assets (uncomment jika perlu)
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/fonts/

  # Custom fonts (uncomment jika perlu)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700